<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DocFlow | Dashboard</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<header class="topbar">
		<div>
			<h2>Dashboard</h2>
			<p class="muted" id="welcome-user"></p>
		</div>
		<nav class="top-actions">
			<a class="btn" href="create-doc.html">New Document</a>
			<a class="btn" href="folder.html">Folders</a>
			<a class="btn" href="share-doc.html">Share</a>
			<button class="btn danger" id="logout-btn" type="button">Logout</button>
		</nav>
	</header>

	<main class="page-shell">
		<section class="card">
			<div class="section-head">
				<h3>Your Documents</h3>
				<button class="btn" id="refresh-docs" type="button">Refresh</button>
			</div>
			<div id="documents-list" class="list"></div>
			<p id="dashboard-message" class="message"></p>
		</section>
	</main>

	<script src="js/api.js"></script>
	<script src="js/document.js"></script>
</body>
</html>
